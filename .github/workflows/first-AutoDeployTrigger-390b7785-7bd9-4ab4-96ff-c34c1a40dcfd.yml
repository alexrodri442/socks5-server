name: Trigger auto deployment for first

# When this action will be executed
on:
  # Automatically trigger it when detected changes in repo
  push:
    branches: 
      [ master ]
    paths:
    - '**'
    - '.github/workflows/first-AutoDeployTrigger-390b7785-7bd9-4ab4-96ff-c34c1a40dcfd.yml'

  # Allow manual trigger 
  workflow_dispatch:      

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions: 
      id-token: write #This is required for requesting the OIDC JWT Token
      contents: read #Required when GH token is used to authenticate with private repo

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      - name: Azure Login
        uses: azure/login@v1
        with:
          client-id: ${{ secrets.FIRST_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.FIRST_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.FIRST_AZURE_SUBSCRIPTION_ID }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}
          _dockerfilePathKey_: _dockerfilePath_
          registryUrl: 
          registryUsername: ${{ secrets.FIRST_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.FIRST_REGISTRY_PASSWORD }}
          containerAppName: first
          resourceGroup: 1
          imageToBuild: default/[parameters('containerAppName')]:${{ github.sha }}
          _buildArgumentsKey_: |
            _buildArgumentsValues_


